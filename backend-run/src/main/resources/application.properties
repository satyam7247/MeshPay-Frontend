# Server
server.port=8080
spring.config.import=optional:file:.env[.properties]

spring.profiles.default=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration/{vendor}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.mvc.log-request-details=false

# Local simulator only: UPI_MESH_DEMO_SEED=true seeds the four demo ledger accounts.
# Leave false for API-only use; only seeded demo accounts get the demo credential exception.
upi.mesh.demo.seed-accounts=${UPI_MESH_DEMO_SEED:false}
# UPI_MESH_DEMO_ENDPOINTS_ENABLED=true exposes mutable simulator endpoints; keep false outside a trusted local demo.
upi.mesh.demo.endpoints-enabled=${UPI_MESH_DEMO_ENDPOINTS_ENABLED:false}

# Logging
logging.level.root=INFO
logging.level.com.demo.upimesh=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http.converter=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
# HTTP client debug logging can include serialized request bodies (including email OTPs).
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.springframework.http.converter=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Idempotency window
upi.mesh.idempotency-ttl-seconds=86400

# Packet freshness window
upi.mesh.packet-max-age-seconds=86400

# Production SMS verification (credentials must remain server-side)
app.sms.provider=${SMS_PROVIDER:none}
# Bank-link OTP has an independent selector so the Twilio SMS service used by other OTP flows is unaffected.
app.bank-otp.provider=${BANK_LINK_OTP_PROVIDER:${SMS_PROVIDER:none}}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
app.otp.hmac-secret=${BANK_LINK_OTP_HMAC_SECRET:}
app.otp.allow-email-for-bank-link=${ALLOW_EMAIL_BANK_LINK_OTP:false}
app.account-deletion-otp.provider=${ACCOUNT_DELETION_OTP_PROVIDER:${SMS_PROVIDER:none}}
app.otp.allow-email-for-account-deletion=${ALLOW_EMAIL_ACCOUNT_DELETION_OTP:false}
app.environment=${APP_ENVIRONMENT:}

# Cashfree Secure ID bank verification (requires an approved account and whitelisted server IP).
app.bank-verification.provider=${BANK_VERIFICATION_PROVIDER:none}
app.bank-verification.cashfree.environment=${CASHFREE_ENVIRONMENT:}
app.bank-verification.cashfree.client-id=${CASHFREE_CLIENT_ID:}
app.bank-verification.cashfree.client-secret=${CASHFREE_CLIENT_SECRET:}
app.bank-data.encryption-key=${BANK_DATA_ENCRYPTION_KEY:}

# Razorpay webhook secret is required before accepting any payment-provider callback.
app.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Brevo Transactional Email (server-side only; never configure these in the Expo app).
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.email.brevo.sender-name=${BREVO_SENDER_NAME:}

# Only these socket peers may supply X-Forwarded-For for rate-limit IP attribution.
app.security.trusted-proxy-addresses=${APP_SECURITY_TRUSTED_PROXY_ADDRESSES:${TRUSTED_PROXY_ADDRESSES:}}
upi.app-lock.idle-timeout-seconds=${APP_LOCK_IDLE_TIMEOUT_SECONDS:300}
